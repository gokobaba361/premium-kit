name: quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit theme contrast
        run: npm run audit:contrast

      - name: Audit registry integrity
        run: npm run audit:registry

      - name: Audit Turkish coverage
        run: npm run audit:i18n

      - name: Build
        run: npm run build
